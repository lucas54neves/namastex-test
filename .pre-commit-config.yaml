repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.13
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy .
        language: python
        additional_dependencies:
          - duckdb==1.5.2
          - fastparquet==2026.3.0
          - pandas==3.0.2
          - polars==1.40.0
          - pyarrow==23.0.1
          - mypy==1.20.1
        pass_filenames: false
        types: [python]

      - id: pytest
        name: pytest
        entry: pytest
        language: python
        additional_dependencies:
          - duckdb==1.5.2
          - fastparquet==2026.3.0
          - pandas==3.0.2
          - polars==1.40.0
          - pyarrow==23.0.1
          - pytest==9.0.3
        pass_filenames: false
        stages: [pre-push]
